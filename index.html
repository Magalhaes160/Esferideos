<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Esferídeos</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Outfit:wght@400;500;600;700&display=swap">
<style>
/* Layout: cabeçalho colorido com placar; palco com cenário e esfera à esquerda (muda a cada fase); painel com abas à direita; empilha no celular. */
:root{
  --bg:#eef3fb; --surface:#ffffff; --surface2:#f3f6fc; --ink:#14213d; --mute:#5b6b8a; --line:#d5deef;
  --c-teal:#0aa58f; --c-coral:#f2555a; --c-violet:#6c4cf0; --c-gold:#f0a000;
  --accent:var(--c-violet); --accent-ink:#ffffff; --tab-ink:#ffffff;
  --gold:#a86a00; --gold-bg:#fff1cc; --shade:rgba(20,33,61,.16); --ph:#4cc765;
  --r0:#7b8f97; --r1:#1f9d55; --r2:#2f6fe0; --r3:#d48a00;
  --font-display:'Lilita One','Trebuchet MS',system-ui,sans-serif;
  --font-body:'Outfit',system-ui,-apple-system,'Segoe UI',sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0d1226; --surface:#161d3a; --surface2:#11172f; --ink:#eef1ff; --mute:#9aa7d0; --line:#2a3563;
    --c-teal:#3fd8c2; --c-coral:#ff7d7d; --c-violet:#a08cff; --c-gold:#ffc43d;
    --accent-ink:#16103a; --tab-ink:#16103a; --gold:#ffc43d; --gold-bg:#3a2c0a; --shade:rgba(0,0,0,.45);
    --r0:#93a8b0; --r1:#4cc474; --r2:#6aa3f5; --r3:#ffc43d; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0d1226; --surface:#161d3a; --surface2:#11172f; --ink:#eef1ff; --mute:#9aa7d0; --line:#2a3563;
  --c-teal:#3fd8c2; --c-coral:#ff7d7d; --c-violet:#a08cff; --c-gold:#ffc43d;
  --accent-ink:#16103a; --tab-ink:#16103a; --gold:#ffc43d; --gold-bg:#3a2c0a; --shade:rgba(0,0,0,.45);
  --r0:#93a8b0; --r1:#4cc474; --r2:#6aa3f5; --r3:#ffc43d; color-scheme:dark;
}
*{box-sizing:border-box}
body{
  background:var(--bg); color:var(--ink); font-family:var(--font-body); font-size:16px; line-height:1.45;
  padding-block:20px 40px; position:relative;
  padding-left:max(16px,env(safe-area-inset-left,0px)); padding-right:max(16px,env(safe-area-inset-right,0px));
}
body::before{
  content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;
  background:
    radial-gradient(620px 420px at 8% 0%,color-mix(in srgb,var(--ph) 34%,transparent),transparent 70%),
    radial-gradient(520px 420px at 100% 25%,color-mix(in srgb,var(--c-violet) 24%,transparent),transparent 70%),
    radial-gradient(520px 380px at 40% 100%,color-mix(in srgb,var(--c-coral) 16%,transparent),transparent 70%);
  transition:background .8s;
}
button{font:inherit;color:inherit}
.wrap{max-width:1080px;margin:0 auto;display:flex;flex-direction:column;gap:16px}

/* Cabeçalho */
.top{display:flex;flex-wrap:wrap;gap:12px 24px;align-items:flex-end;justify-content:space-between}
.brand{font-family:var(--font-display);font-weight:400;font-size:clamp(1.7rem,6vw,2.2rem);line-height:1;margin:0}
.logo{color:var(--c-violet);background:linear-gradient(90deg,var(--c-teal),var(--c-violet) 55%,var(--c-coral));-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
.sub{font-size:.75rem;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--mute);margin-top:6px}
.score{display:flex;flex-direction:column;align-items:flex-end;min-width:0}
.score .num{font-family:var(--font-display);font-size:clamp(2.2rem,8vw,3.4rem);line-height:1;color:var(--gold);font-variant-numeric:tabular-nums;text-shadow:0 2px 0 color-mix(in srgb,var(--c-gold) 30%,transparent)}
.score .lbl{font-size:.75rem;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--mute)}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(135px,1fr));gap:10px}
.stat{--t:var(--c-teal);background:color-mix(in srgb,var(--t) 15%,var(--surface));border:1px solid color-mix(in srgb,var(--t) 40%,var(--line));border-radius:14px;padding:10px 12px;min-width:0}
.stat.k1{--t:var(--c-coral)}.stat.k2{--t:var(--c-teal)}.stat.k3{--t:var(--c-violet)}.stat.k4{--t:var(--c-gold)}
.stat b{display:block;font-family:var(--font-display);font-weight:400;font-size:1.3rem;font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.stat span{font-size:.72rem;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--mute);display:flex;align-items:center;gap:6px}
.stat span::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--t)}

/* Grade principal */
.main{display:grid;grid-template-columns:1fr;gap:16px}
@media (min-width:900px){.main{grid-template-columns:minmax(340px,420px) minmax(0,1fr);align-items:start}}

/* Palco */
.stage{
  position:relative;isolation:isolate;overflow:hidden;border-radius:24px;min-height:700px;background:#4db8ff;
  border:2px solid color-mix(in srgb,var(--ph) 55%,var(--line));box-shadow:0 12px 30px var(--shade);
  padding:14px;display:flex;flex-direction:column;align-items:center;gap:10px;
}
@media (min-width:900px){.stage{position:sticky;top:16px}}
.scene{position:absolute;inset:0;z-index:-1}
.layer{position:absolute;inset:0}
.layer svg{width:100%;height:100%;display:block}
.glass{background:rgba(8,16,28,.52);color:#fff;border-radius:14px;backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
.phase{align-self:stretch;padding:10px 12px;display:flex;flex-direction:column;gap:7px}
.ph-row{display:flex;justify-content:space-between;gap:8px;align-items:baseline;flex-wrap:wrap}
.ph-row b{font-family:var(--font-display);font-weight:400;font-size:1.1rem}
.ph-row span{font-size:.8rem;opacity:.85}
.pbar{height:8px;border-radius:99px;background:rgba(255,255,255,.22);overflow:hidden}
.pbar i{display:block;height:100%;width:0;background:linear-gradient(90deg,#fff,var(--ph));border-radius:99px;transition:width .3s}
.core-wrap{flex:1;width:100%;display:grid;place-items:center;padding-block:18px}

/* Esfera */
.core{
  position:relative;width:min(56vw,264px);aspect-ratio:1;border:0;background:none;padding:0;border-radius:50%;cursor:pointer;
  -webkit-tap-highlight-color:transparent;touch-action:manipulation;user-select:none;
}
.core:focus-visible{outline:3px solid #fff;outline-offset:10px}
.sphere{
  position:absolute;inset:0;border-radius:50%;overflow:hidden;
  background:radial-gradient(circle at 34% 26%,var(--o1),var(--o2) 78%);
  box-shadow:inset -16px -20px 34px rgba(0,0,0,.3),inset 10px 12px 26px rgba(255,255,255,.35),0 0 48px 6px var(--og),0 22px 28px rgba(0,0,0,.28);
}
.sphere::before{content:"";position:absolute;left:15%;top:9%;width:36%;height:20%;border-radius:50%;background:rgba(255,255,255,.55);filter:blur(2px);transform:rotate(-28deg)}
.swirl{position:absolute;inset:-20%;background:conic-gradient(from 0deg,transparent,rgba(255,255,255,.3),transparent 28%,rgba(255,255,255,.18),transparent 58%,rgba(255,255,255,.26),transparent);animation:spin2 12s linear infinite}
@keyframes spin2{to{transform:rotate(360deg)}}
.ring{
  position:absolute;inset:calc(var(--i) * -6% - 8%);border-radius:50%;pointer-events:none;
  border:2px solid color-mix(in srgb,var(--ring) 75%,transparent);box-shadow:0 0 12px color-mix(in srgb,var(--ring) 60%,transparent);
  transform:rotate(var(--rz)) rotateX(var(--tilt)) rotateZ(0deg);animation:orbit 8s linear infinite;
}
.ring::after{content:"";position:absolute;left:50%;top:-6px;width:11px;height:11px;margin-left:-5px;border-radius:50%;background:var(--ring);box-shadow:0 0 12px 2px var(--ring)}
@keyframes orbit{to{transform:rotate(var(--rz)) rotateX(var(--tilt)) rotateZ(360deg)}}
.mon{position:absolute;left:50%;top:50%;width:66%;aspect-ratio:1;margin:-33% 0 0 -33%;pointer-events:none;filter:drop-shadow(0 6px 6px rgba(0,0,0,.35))}
.mon svg{width:100%;height:100%;display:block;animation:bob 2.6s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-4px)}}
.gem svg{animation:pulse 1.8s ease-in-out infinite;filter:drop-shadow(0 0 10px #fff)}
@keyframes pulse{50%{transform:scale(1.12);opacity:.8}}

.partner{padding:8px 16px;text-align:center;max-width:100%}
.partner b{font-family:var(--font-display);font-weight:400;font-size:1.2rem;display:block}
.partner span{font-size:.82rem;opacity:.9}
.hint{font-size:.82rem;margin:0;text-align:center;color:#fff;text-shadow:0 1px 3px rgba(0,0,0,.6)}

/* Efeitos de clique */
.fx{position:absolute;inset:0;pointer-events:none;z-index:5;overflow:hidden}
.spark{position:absolute;border-radius:50%;pointer-events:none}
.spark.star{border-radius:0;clip-path:polygon(50% 0,62% 38%,100% 50%,62% 62%,50% 100%,38% 62%,0 50%,38% 38%)}
.ripple{position:absolute;border:4px solid #fff;border-radius:50%;pointer-events:none}
.float{
  position:absolute;pointer-events:none;font-family:var(--font-display);font-size:1.5rem;color:#fff;white-space:nowrap;
  text-shadow:0 2px 0 rgba(0,0,0,.45),0 0 10px var(--ph);animation:rise .95s ease-out forwards;
}
.float.crit{font-size:2rem;color:#ffe27a}
@keyframes rise{from{opacity:1;transform:translate(-50%,0) scale(.8)}20%{transform:translate(-50%,-14px) scale(1.15)}to{opacity:0;transform:translate(-50%,-80px) scale(1)}}

/* Cenários */
.cl{animation:drift 80s linear infinite}
@keyframes drift{from{transform:translateX(-170px)}to{transform:translateX(540px)}}
.tw{animation:tw 2.4s ease-in-out infinite alternate}
@keyframes tw{from{opacity:.15}to{opacity:1}}
.ff{animation:ff 5s ease-in-out infinite alternate}
@keyframes ff{from{transform:translate(0,0);opacity:.2}50%{opacity:1}to{transform:translate(14px,-18px);opacity:.3}}
.em{animation:em 5.5s linear infinite}
@keyframes em{from{transform:translateY(0);opacity:1}to{transform:translateY(-360px);opacity:0}}
.bolt{opacity:0;animation:bolt 5s linear infinite}
@keyframes bolt{0%,88%{opacity:0}90%{opacity:1}92%{opacity:.15}94%{opacity:1}100%{opacity:0}}
.wave{animation:wave 6s ease-in-out infinite alternate}
@keyframes wave{from{transform:translateX(-16px)}to{transform:translateX(16px)}}

/* Painel */
.panel{background:var(--surface);border:1px solid var(--line);border-radius:22px;overflow:hidden;min-width:0;box-shadow:0 8px 24px var(--shade)}
.tabs{display:flex;gap:6px;padding:10px;background:linear-gradient(90deg,color-mix(in srgb,var(--c-teal) 22%,var(--surface2)),color-mix(in srgb,var(--c-violet) 22%,var(--surface2)),color-mix(in srgb,var(--c-coral) 22%,var(--surface2)));border-bottom:1px solid var(--line)}
.tab{flex:1;border:0;background:transparent;border-radius:12px;padding:10px 8px;font-weight:700;cursor:pointer;color:var(--ink)}
.tab[aria-selected="true"]{background:var(--c-violet);color:var(--tab-ink);box-shadow:0 3px 8px var(--shade)}
.tab:focus-visible,.item:focus-visible,.btn:focus-visible,.link:focus-visible{outline:3px solid var(--c-violet);outline-offset:2px}
.pane{padding:14px;display:flex;flex-direction:column;gap:10px}
.pane h2{margin:6px 0 0;font-size:.75rem;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:var(--mute)}
.pane h2:first-child{margin-top:0}
.item{
  --t:var(--c-teal);display:grid;grid-template-columns:50px minmax(0,1fr) auto;gap:12px;align-items:center;text-align:left;width:100%;
  background:var(--surface2);border:1px solid var(--line);border-radius:16px;padding:10px 12px;cursor:pointer;
}
.item.k-click{--t:var(--c-coral)}.item.k-orb{--t:var(--c-violet)}
.item:not(:disabled){border-color:color-mix(in srgb,var(--t) 60%,var(--line));background:color-mix(in srgb,var(--t) 9%,var(--surface))}
.item:hover:not(:disabled){transform:translateY(-1px);box-shadow:0 5px 14px var(--shade)}
.item:disabled{opacity:.55;cursor:not-allowed}
.badge{width:50px;height:50px;border-radius:14px;display:grid;place-items:center;background:color-mix(in srgb,var(--t) 24%,var(--surface));color:var(--t);font-family:var(--font-display);font-size:1.3rem;font-variant-numeric:tabular-nums}
.badge svg{width:42px;height:42px}
.nm{font-weight:700}.ds{font-size:.82rem;color:var(--mute);overflow-wrap:anywhere}
.cs{font-family:var(--font-display);color:var(--gold);background:var(--gold-bg);border-radius:99px;padding:4px 10px;font-size:1rem;font-variant-numeric:tabular-nums;white-space:nowrap}

/* Coleção */
.prog{display:flex;align-items:center;gap:10px;font-size:.9rem;color:var(--mute);font-weight:600}
.bar{flex:1;height:10px;border-radius:99px;background:var(--surface2);border:1px solid var(--line);overflow:hidden}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--c-teal),var(--c-violet),var(--c-coral));width:0;transition:width .3s}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(118px,1fr));gap:10px}
.card{
  background:color-mix(in srgb,var(--tc,var(--line)) 16%,var(--surface));border:1px solid color-mix(in srgb,var(--tc,var(--line)) 45%,var(--line));
  border-bottom:4px solid var(--rc,var(--line));border-radius:14px;padding:8px;display:flex;flex-direction:column;align-items:center;gap:2px;text-align:center;min-width:0
}
.card svg{width:78px;height:78px}
.card.off{background:var(--surface2);border-color:var(--line)}
.card.off svg{filter:brightness(0);opacity:.18}
.card .n{font-weight:700;font-size:.9rem;overflow-wrap:anywhere}
.card .m{font-size:.72rem;color:var(--mute)}
.chip{font-size:.65rem;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--rc)}
button.card{font:inherit;color:inherit;cursor:pointer;width:100%;position:relative}
button.card:hover{transform:translateY(-1px);box-shadow:0 5px 14px var(--shade)}
.card.sel{outline:3px solid var(--c-violet);outline-offset:2px}
.card:focus-visible,.slot:focus-visible,.btn2:focus-visible{outline:3px solid var(--c-violet);outline-offset:2px}
.tagrow{position:absolute;top:5px;left:5px;right:5px;display:flex;flex-direction:column;align-items:flex-start;gap:3px;pointer-events:none}
.pill{font-size:.58rem;font-weight:800;letter-spacing:.06em;text-transform:uppercase;border-radius:99px;padding:2px 7px;background:var(--c-violet);color:var(--tab-ink)}
.pill.t{background:var(--c-teal)}
.team{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.slot{
  font:inherit;color:inherit;cursor:pointer;min-width:0;border:2px dashed var(--line);background:var(--surface2);border-radius:16px;
  padding:8px 4px;display:flex;flex-direction:column;align-items:center;gap:2px;text-align:center
}
.slot.full{--tc:var(--line);border-style:solid;border-color:color-mix(in srgb,var(--tc) 55%,var(--line));background:color-mix(in srgb,var(--tc) 14%,var(--surface))}
.slot.target{border-color:var(--c-violet)}
.slot svg{width:70px;height:70px;max-width:100%}
.slot .plus{width:70px;height:70px;display:grid;place-items:center;font-family:var(--font-display);font-size:2.2rem;color:var(--mute)}
.slot .n{font-weight:700;font-size:.85rem;overflow-wrap:anywhere}
.slot .m{font-size:.7rem;color:var(--mute)}
.detail{background:color-mix(in srgb,var(--c-violet) 10%,var(--surface));border:1px solid color-mix(in srgb,var(--c-violet) 40%,var(--line));border-radius:16px;padding:12px;display:flex;flex-direction:column;gap:8px}
.detail b{font-family:var(--font-display);font-weight:400;font-size:1.2rem}
.detail .row{display:flex;flex-wrap:wrap;gap:8px}
.btn2{font:inherit;border:1px solid var(--c-violet);background:var(--surface);color:var(--ink);border-radius:12px;padding:9px 14px;font-weight:700;cursor:pointer;align-self:flex-start}
.btn2.main{background:var(--c-violet);color:var(--tab-ink)}
.btn2:disabled{opacity:.55;cursor:not-allowed}
.swap{display:block;margin:8px auto 0;font:inherit;font-weight:700;font-size:.82rem;color:#fff;background:rgba(255,255,255,.2);border:1px solid rgba(255,255,255,.55);border-radius:99px;padding:6px 14px;cursor:pointer}
.swap:hover{background:rgba(255,255,255,.32)}
.swap:focus-visible{outline:3px solid #fff;outline-offset:2px}
.pick{width:min(100%,520px);max-height:88vh;overflow:auto;align-items:stretch;text-align:left}
.pick h3{text-align:center}
.pick .btn,.pick .btn2{align-self:center}
.mini{display:flex;gap:8px;justify-content:center}
.mini span{width:48px;height:48px;border-radius:50%;background:rgba(8,16,28,.52);border:2px solid rgba(255,255,255,.5);display:grid;place-items:center;overflow:hidden}
.mini span:empty{border-style:dashed;opacity:.6}
.mini svg{width:42px;height:42px}

/* Revelação */
.reveal{
  position:fixed;inset:0;z-index:20;background:rgba(6,10,28,.88);display:grid;place-items:center;overflow:hidden;
  padding:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(16px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));
}
.reveal[hidden],.pane[hidden],.toast[hidden]{display:none}
.rcard{width:min(100%,360px);background:var(--surface);border-radius:26px;padding:22px 18px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:8px;border:3px solid var(--rc,var(--line));box-shadow:0 0 40px color-mix(in srgb,var(--rc,transparent) 55%,transparent)}
.rcard .orb{width:150px;height:150px}.rcard .orb svg{width:100%;height:100%}
.shake{animation:shake .5s ease-in-out infinite}
@keyframes shake{0%,100%{transform:rotate(0)}25%{transform:rotate(-14deg)}75%{transform:rotate(14deg)}}
.pop{animation:pop .45s cubic-bezier(.2,1.6,.4,1)}
@keyframes pop{from{transform:scale(.3);opacity:0}to{transform:scale(1);opacity:1}}
.rcard .art{position:relative;width:190px;height:190px}
.rcard .art::before{content:"";position:absolute;inset:-12%;border-radius:50%;background:radial-gradient(var(--rc),transparent 65%);opacity:.5}
.rcard .art svg{position:relative;width:100%;height:100%}
.rcard h3{font-family:var(--font-display);font-weight:400;font-size:1.8rem;margin:0}
.rcard p{margin:0;color:var(--mute);font-size:.9rem}
.tag{font-family:var(--font-display);color:var(--rc);font-size:1rem;letter-spacing:.04em}
.btn{margin-top:8px;border:0;border-radius:14px;background:var(--c-violet);color:var(--tab-ink);font-weight:800;padding:12px 30px;cursor:pointer}

.toast{position:fixed;left:50%;transform:translateX(-50%);top:calc(12px + env(safe-area-inset-top,0px));z-index:30;background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:14px;font-weight:700;max-width:calc(100vw - 32px);text-align:center}
.foot{display:flex;flex-wrap:wrap;gap:8px 16px;justify-content:space-between;align-items:center;font-size:.82rem;color:var(--mute)}
.link{background:none;border:0;padding:4px 0;text-decoration:underline;cursor:pointer;color:var(--mute)}

@media (prefers-reduced-motion:reduce){
  .swirl,.ring,.mon svg,.gem svg,.shake,.cl,.tw,.ff,.em,.bolt,.wave{animation:none}
  .pop,.float{animation-duration:.01s}.bolt{opacity:0}
}
</style>

<div class="wrap">
  <header class="top">
    <div><h1 class="brand"><span class="logo">Esferídeos</span></h1><div class="sub">Capture todos os Esferídeos</div></div>
    <div class="score"><span class="lbl">Centelhas</span><span class="num" id="score">0</span></div>
  </header>
  <section class="stats" aria-label="Estatísticas">
    <div class="stat k1"><span>Por clique</span><b id="sClick">1</b></div>
    <div class="stat k2"><span>Por segundo</span><b id="sPps">0</b></div>
    <div class="stat k3"><span>Por hora</span><b id="sHour">0</b></div>
    <div class="stat k4"><span>Multiplicador</span><b id="sMult">x1,00</b></div>
  </section>

  <main class="main">
    <section class="stage" id="stage">
      <div class="scene" id="scene"></div>
      <div class="phase glass">
        <div class="ph-row"><b id="phName">Fase 1</b><span id="phNext"></span></div>
        <div class="pbar"><i id="phBar"></i></div>
      </div>
      <div class="core-wrap"><button class="core" id="core" aria-label="Clique na esfera para ganhar centelhas"></button></div>

/* ---------- Fases, esfera e cenário ---------- */
var stage=$('#stage'),core=$('#core'),fx=$('#fx'),sceneBox=$('#scene');
var sphere=null,monEl=null,curPhase=-1,curScene=-1;
function phaseOf(t){var p=0;for(var i=0;i<PHASES.length;i++){if(t>=PHASES[i].th)p=i;}return p;}

function setScene(p,instant){
  if(p===curScene)return;curScene=p;
  var d=document.createElement('div');d.className='layer';d.innerHTML=sceneSVG(p);
  var old=Array.prototype.slice.call(sceneBox.querySelectorAll('.layer'));
  sceneBox.appendChild(d);
  if(instant||reduced||!d.animate){old.forEach(function(o){o.remove();});return;}
  d.style.opacity=0;
  var an=d.animate([{opacity:0},{opacity:1}],{duration:1400,fill:'forwards'});
  an.onfinish=function(){d.style.opacity=1;old.forEach(function(o){o.remove();});};
}
function buildOrb(p){
  var P=PHASES[p],h='',i,tilts=[72,62,78,54],rz=[0,40,-40,80];
  core.style.setProperty('--o1',P.o1);core.style.setProperty('--o2',P.o2);core.style.setProperty('--og',P.og);core.style.setProperty('--ring',P.ring);
  h+='<span class="sphere"><span class="swirl"></span></span>';
  for(i=0;i<P.rings;i++){
    h+='<i class="ring" style="--i:'+i+';--tilt:'+tilts[i]+'deg;--rz:'+rz[i]+'deg;animation-duration:'+(7+i*3)+'s;animation-direction:'+(i%2?'reverse':'normal')+'"></i>';
  }

  core.innerHTML=h;

}
function partner(){
  if(S.show&&S.mons[S.show])return byId(S.show);
  var best=null,bv=-1;
  CREATURES.forEach(function(c){var l=S.mons[c.id]||0;if(!l)return;var v=l*RAR[c.r].m+c.r*0.01;if(v>bv){bv=v;best=c;}});
  return best;
}
function renderMon(){
  var c=partner(),P=PHASES[curPhase];
  if(c){
    monEl.className='mon';monEl.innerHTML=art(c);
    $('#pName').textContent=c.name;
    $('#pSub').textContent=TYPES[c.type].name+' · '+RAR[c.r].name+' · nível '+S.mons[c.id]+' · '+P.orb;
  }else{
    monEl.className='mon gem';
    monEl.innerHTML='<svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg"><path d="M50 10 L58 42 L90 50 L58 58 L50 90 L42 58 L10 50 L42 42Z" fill="#fff" opacity=".92"/></svg>';
    $('#pName').textContent=P.orb;
    $('#pSub').textContent='Capture uma criatura para ela assumir o treino.';
  }
}
function applyPhase(p,instant){
  var up=curPhase>=0&&p>curPhase,P=PHASES[p];
  curPhase=p;
  document.documentElement.style.setProperty('--ph',P.ph);
  setScene(p,instant);
  buildOrb(p);renderMon();
  $('#phName').textContent='Fase '+(p+1)+' · '+P.name;
  if(up&&!instant){
    say('Nova fase: '+P.name+'! Sua esfera virou '+P.orb+'.');
    var cr=core.getBoundingClientRect(),sr=stage.getBoundingClientRect();
    var cx=cr.left+cr.width/2-sr.left,cy=cr.top+cr.height/2-sr.top;
    ripple(cx,cy,cr.width,'#fff');sparks(fx,cx,cy,40,P.sp,170);
    if(sphere&&!reduced)sphere.animate([{transform:'scale(.7)',opacity:.4},{transform:'scale(1.12)',offset:.6},{transform:'scale(1)',opacity:1}],{duration:700,easing:'ease-out'});
  }
}
var elBar=$('#phBar'),elNext=$('#phNext');
function updPhaseUI(){
  var P=PHASES[curPhase],N=PHASES[curPhase+1];
  if(!N){elBar.style.width='100%';elNext.textContent='Fase final';return;}
  var f=curPhase===0?S.total/N.th:(Math.log(Math.max(S.total,1))-Math.log(P.th))/(Math.log(N.th)-Math.log(P.th));
  elBar.style.width=Math.max(2,Math.min(100,f*100)).toFixed(1)+'%';
  elNext.textContent='Próxima: '+N.name+' em '+fmt(Math.max(0,N.th-S.total));
}

/* ---------- Efeitos de clique ---------- */
function sparks(host,x,y,n,colors,spread){
  if(reduced||!host.animate||host.childElementCount>110)return;
  for(var i=0;i<n;i++){
    (function(){
      var d=document.createElement('i'),a=Math.random()*Math.PI*2,dist=(spread||70)*(.5+Math.random()*.8),dx=Math.cos(a)*dist,dy=Math.sin(a)*dist,sz=6+Math.random()*8;
      d.className='spark'+(i%3===0?' star':'');
      d.style.cssText='left:'+x+'px;top:'+y+'px;width:'+sz+'px;height:'+sz+'px;background:'+colors[i%colors.length];
      host.appendChild(d);
      var an=d.animate([
        {transform:'translate(-50%,-50%) scale(1)',opacity:1},
        {transform:'translate(calc(-50% + '+dx+'px),calc(-50% + '+(dy-26)+'px)) scale(1)',opacity:1,offset:.55},
        {transform:'translate(calc(-50% + '+(dx*1.15)+'px),calc(-50% + '+(dy+40)+'px)) scale(0)',opacity:0}
      ],{duration:520+Math.random()*450,easing:'cubic-bezier(.2,.7,.4,1)'});
      an.onfinish=function(){d.remove();};
    })();
  }
}
function ripple(cx,cy,w,color){
  if(reduced||!fx.animate)return;
  var r=document.createElement('i');r.className='ripple';
  r.style.cssText='left:'+cx+'px;top:'+cy+'px;width:'+w+'px;height:'+w+'px;border-color:'+color;
  fx.appendChild(r);
  r.animate([{transform:'translate(-50%,-50%) scale(.5)',opacity:.9},{transform:'translate(-50%,-50%) scale(1.5)',opacity:0}],{duration:650,easing:'ease-out'}).onfinish=function(){r.remove();};
}
function floatNum(x,y,v,crit){
  var f=document.createElement('span'),w=fx.clientWidth||300;
  f.className='float'+(crit?' crit':'');f.textContent=(crit?'CRÍTICO +':'+')+fmtRate(v);
  f.style.left=Math.max(60,Math.min(w-60,x))+'px';f.style.top=(y-12)+'px';
  fx.appendChild(f);f.addEventListener('animationend',function(){f.remove();});
}
function clickFx(x,y,cx,cy,w,crit){
  if(reduced||!core.animate)return;
  var P=PHASES[curPhase],c=partner(),cols=c?[TYPES[c.type].a,TYPES[c.type].d,'#ffffff']:P.sp;
  if(sphere)sphere.animate([{transform:'scale(1)'},{transform:'scale(.9,1.08)',offset:.3},{transform:'scale(1.07,.94)',offset:.65},{transform:'scale(1)'}],{duration:crit?430:280,easing:'ease-out'});
  if(monEl)monEl.animate([{transform:'translateY(0) rotate(0)'},{transform:'translateY(-12px) rotate(-7deg)',offset:.35},{transform:'translateY(0) rotate(6deg)',offset:.7},{transform:'translateY(0) rotate(0)'}],{duration:crit?500:330,easing:'ease-out'});
  ripple(cx,cy,w,P.ring);
  sparks(fx,x,y,crit?20:9,cols,crit?120:72);
  if(crit)stage.animate([{transform:'translate(0,0)'},{transform:'translate(-5px,3px)'},{transform:'translate(5px,-3px)'},{transform:'translate(-3px,-2px)'},{transform:'translate(0,0)'}],{duration:280});
}
core.addEventListener('click',function(e){
  var crit=Math.random()<critChance(),v=clickVal()*(crit?critMult():1);
  S.pts+=v;S.total+=v;S.clicks++;

  var cx=cr.left+cr.width/2-sr.left,cy=cr.top+cr.height/2-sr.top,x,y;
  if(e.detail===0||!e.clientX){x=cx;y=cy-cr.height*.2;}else{x=e.clientX-sr.left;y=e.clientY-sr.top;}
  floatNum(x,y,v,crit);clickFx(x,y,cx,cy,cr.width,crit);refresh();

  elMult.textContent='x'+mult().toLocaleString('pt-BR',{minimumFractionDigits:2,maximumFractionDigits:2});
  items.forEach(function(it){
    var n=it.count(),maxed=it.max&&n>=it.max,c=maxed?Infinity:it.cost();
    it.cs.textContent=maxed?'MÁX':fmt(c);it.badge.textContent=n;it.el.disabled=maxed||S.pts<c;

    var l=S.mons[c.id],r=RAR[c.r],inT=inTeam(c.id),onOrb=S.show===c.id,full=S.team.indexOf(null)<0;
    h+='<div class="detail"><b>'+c.name+'</b><span class="ds">'+TYPES[c.type].name+' · '+r.name+' · nível '+l+' · +'+(l*r.m)+'% de multiplicador</span><div class="row">'
      +'<button class="btn2 main" data-act="orb" type="button"'+(onOrb?' disabled':'')+'>'+(onOrb?'Na esfera agora':'Mostrar na esfera')+'</button>'
      +(inT?'<button class="btn2" data-act="out" type="button">Tirar do time</button>':'<button class="btn2" data-act="in" type="button"'+(full?' disabled':'')+'>Colocar no time</button>')
      +'</div>'+(!inT&&full?'<span class="ds">Time cheio. Toque em uma vaga para trocar.</span>':(!inT?'<span class="ds">Ou toque em uma vaga para escolher onde ele fica.</span>':''))+'</div>';
  }else{
    h+='<p class="ds">Toque em uma criatura para escolher a da esfera ou montar o time.</p>';
  }
  if(S.show)h+='<button class="btn2" data-act="auto" type="button">Voltar para a melhor automática</button>';
  h+='<h2>Coleção</h2><div class="prog"><span>'+owned+' de '+CREATURES.length+'</span><div class="bar"><i style="width:'+(owned/CREATURES.length*100)+'%"></i></div></div><div class="grid">';
  CREATURES.forEach(function(c){
    var l=S.mons[c.id]||0,r=RAR[c.r],st='--rc:'+r.v+';--tc:'+TYPES[c.type].a;
    if(!l){h+='<div class="card off" style="'+st+'">'+art(c)+'<span class="n">???</span><span class="chip">'+r.name+'</span><span class="m">Ainda não capturada</span></div>';return;}
    var ti=S.team.indexOf(c.id),tags='';
    if(S.show===c.id)tags+='<span class="pill">Esfera</span>';
    if(ti>=0)tags+='<span class="pill t">Time '+(ti+1)+'</span>';
    h+='<button class="card'+(sel===c.id?' sel':'')+'" data-id="'+c.id+'" type="button" style="'+st+'"><span class="tagrow">'+tags+'</span>'+art(c)
      +'<span class="n">'+c.name+'</span><span class="chip">'+r.name+'</span>'
      +'<span class="m">'+TYPES[c.type].name+' · nv '+l+' · +'+(l*r.m)+'%</span></button>';
  });
  pCol.innerHTML=h+'</div>';
  renderMini();
}
/* Escolha rápida da criatura da esfera */
var picker=$('#picker'),pcard=$('#pcard');
function openPicker(){
  var owned=CREATURES.filter(function(c){return S.mons[c.id];});
  if(!owned.length){say('Capture uma criatura primeiro, na aba Esferas.');return;}
  var cur=partner(),h='<h3>Quem fica na esfera?</h3><div class="grid">';
  owned.forEach(function(c){
    var l=S.mons[c.id],r=RAR[c.r];
    h+='<button class="card'+(cur&&cur.id===c.id?' sel':'')+'" data-pick="'+c.id+'" type="button" style="--rc:'+r.v+';--tc:'+TYPES[c.type].a+'">'
      +(cur&&cur.id===c.id?'<span class="tagrow"><span class="pill">Na esfera</span></span>':'')+art(c)
      +'<span class="n">'+c.name+'</span><span class="chip">'+r.name+'</span><span class="m">nv '+l+' · +'+(l*r.m)+'%</span></button>';
  });
  h+='</div><button class="btn2" data-pick="auto" type="button">Automática (a de maior bônus)</button><button class="btn" data-pick="close" type="button">Fechar</button>';
  pcard.innerHTML=h;picker.hidden=false;
  var f=pcard.querySelector('.card.sel')||pcard.querySelector('.card');if(f)f.focus({preventScroll:true});
}
function closePicker(){picker.hidden=true;$('#swap').focus({preventScroll:true});}
$('#swap').addEventListener('click',openPicker);
pcard.addEventListener('click',function(e){
  var t=e.target.closest('[data-pick]');if(!t)return;
  var v=t.dataset.pick;
  if(v!=='close'){S.show=(v==='auto')?null:v;save();renderMon();renderCol();}
  closePicker();
});
picker.addEventListener('click',function(e){if(e.target===picker)closePicker();});
document.addEventListener('keydown',function(e){if(e.key==='Escape'&&!picker.hidden)closePicker();});

pCol.addEventListener('click',function(e){
  var t=e.target.closest('[data-id],[data-slot],[data-act]');if(!t)return;
  if(t.dataset.id){
    sel=(sel===t.dataset.id)?null:t.dataset.id;renderCol();
    var el=pCol.querySelector('[data-id="'+t.dataset.id+'"]');if(el)el.focus({preventScroll:true});
    return;
  }
  if(t.dataset.slot!==undefined){
    var i=+t.dataset.slot;
    if(sel&&S.mons[sel]){var j=S.team.indexOf(sel);if(j>=0)S.team[j]=null;S.team[i]=sel;save();}
    else if(S.team[i]){sel=S.team[i];}
    renderCol();return;
  }
  var a=t.dataset.act;
  if(a==='orb'&&sel)S.show=sel;
  else if(a==='auto')S.show=null;
  else if(a==='in'&&sel){var k=S.team.indexOf(null);if(k>=0)S.team[k]=sel;}
  else if(a==='out'&&sel){var q=S.team.indexOf(sel);if(q>=0)S.team[q]=null;}
  save();renderMon();renderCol();
});

/* ---------- Captura ---------- */
function roll(o){
  var tot=o.w.reduce(function(a,b){return a+b;},0),x=Math.random()*tot,ri=0,acc=0;
  for(var i=0;i<o.w.length;i++){acc+=o.w[i];if(x<acc){ri=i;break;}}
  var pool=CREATURES.filter(function(c){return c.r===ri;});
  return pool[Math.floor(Math.random()*pool.length)];
}
var reveal=$('#reveal'),rcard=$('#rcard');
function openOrb(o,paid){
  busy=true;refresh();
  var c=roll(o),lv=S.mons[c.id]||0,status,refund=0;
  if(!lv){S.mons[c.id]=1;status='Nova na coleção';}
  else if(lv<MAXLV){S.mons[c.id]=lv+1;status='Subiu para o nível '+(lv+1);}
  else{refund=Math.floor(paid*0.25);S.pts+=refund;status='Nível máximo: devolveu '+fmt(refund)+' centelhas';}
  save();
  rcard.style.removeProperty('--rc');
  rcard.innerHTML='<div class="orb shake">'+orbArt(o)+'</div><p>Capturando...</p>';
  reveal.hidden=false;
  var done=false;
  function show(){
    if(done)return;done=true;
    var r=RAR[c.r];
    rcard.style.setProperty('--rc',r.v);
    rcard.innerHTML='<span class="tag">'+r.name+' · '+TYPES[c.type].name+'</span><div class="art pop">'+art(c)+'</div><h3></h3><p></p><p></p><button class="btn" type="button" id="okBtn">Continuar</button>';
    rcard.querySelector('h3').textContent=c.name;
    var ps=rcard.querySelectorAll('p');
    ps[0].textContent=status;
    ps[1].textContent='Multiplicador total: x'+mult().toLocaleString('pt-BR',{minimumFractionDigits:2,maximumFractionDigits:2});
    var ok=$('#okBtn');ok.focus();
    var ar=rcard.querySelector('.art').getBoundingClientRect();
    sparks(reveal,ar.left+ar.width/2,ar.top+ar.height/2,12+c.r*10,[TYPES[c.type].a,TYPES[c.type].d,'#ffffff'],150+c.r*30);
    ok.addEventListener('click',function(){reveal.hidden=true;busy=false;renderMon();renderCol();refresh();});
  }
  var tm=setTimeout(show,1200);
  rcard.addEventListener('click',function once(){if(!done){clearTimeout(tm);show();}rcard.removeEventListener('click',once);});
}

/* ---------- Avisos, salvamento, reinício ---------- */
var toast=$('#toast'),tt;
function say(msg){toast.textContent=msg;toast.hidden=false;clearTimeout(tt);tt=setTimeout(function(){toast.hidden=true;},5000);}
var rs=$('#reset'),rt;
rs.addEventListener('click',function(){
  if(rs.dataset.armed){
    S=fresh();save();rs.textContent='Reiniciar progresso';delete rs.dataset.armed;
    curPhase=-1;applyPhase(0,true);renderCol();refresh();say('Progresso reiniciado.');
  }else{
    rs.dataset.armed='1';rs.textContent='Clique de novo para apagar tudo';
    clearTimeout(rt);rt=setTimeout(function(){delete rs.dataset.armed;rs.textContent='Reiniciar progresso';},4000);
  }
});

/* Ganhos offline (até 8 horas) */
(function(){
  var secs=Math.min((Date.now()-S.last)/1000,8*3600);
  if(secs>60){var g=pps()*secs;if(g>0){S.pts+=g;S.total+=g;say('Enquanto você estava fora: +'+fmt(g)+' centelhas.');}}
})();

applyPhase(phaseOf(S.total),true);
renderCol();refresh();

var last=performance.now();
setInterval(function(){
  var n=performance.now(),dt=(n-last)/1000;last=n;
  var g=pps()*dt;S.pts+=g;S.total+=g;refresh();
},100);
setInterval(save,5000);
window.addEventListener('pagehide',save);
document.addEventListener('visibilitychange',function(){if(document.hidden)save();});
})();
</script>
